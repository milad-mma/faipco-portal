<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAIPCO Portal</title>

    <!-- PWA -->
    <!-- نکته: ?v=2 در همین لینک باید هر بار که خودِ manifest.json یا هر
         کدام از آیکون‌های داخلش عوض می‌شود (نه هر Deploy معمولی)، دستی
         بالا برود — تا Chrome روی اندروید (که این فایل‌ها را به‌شدت Cache
         می‌کند) مجبور به دریافت نسخه تازه شود. باید همزمان با v=X داخل
         manifest.json (کلید icons) هماهنگ نگه داشته شود. -->
    <link rel="manifest" href="/manifest.json?v=2" />
    <meta name="theme-color" content="#16324F" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FAIPCO" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
