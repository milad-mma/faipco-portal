<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAIPCO Portal</title>

    <!-- PWA -->
    <!-- نکته: نسخه قبلی این لینک یک ?v=2 برای Cache Busting داشت — حذف شد،
         چون باعث می‌شد Chrome روی اندروید این را «نسخه/آدرس متفاوتی» از
         Manifest نصب‌شده قبلی تشخیص بدهد و دکمه «نصب» را دوباره نشان دهد،
         حتی برای کاربرانی که از قبل PWA را نصب کرده بودند. نیازی هم به آن
         نبود: location = /manifest.json در Nginx از قبل هدر
         Cache-Control: no-cache, must-revalidate می‌فرستد — یعنی مرورگر
         همیشه قبل از استفاده از نسخه Cache شده، با سرور تأیید می‌گیرد؛
         همین برای جلوگیری از قدیمی‌ماندن Manifest کافی است. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16324F" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FAIPCO" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
