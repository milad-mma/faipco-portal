<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FAIPCO Portal</title>
    <!-- لوگو صفحه اسپلش را همان لحظه شروع Parse شدن HTML (نه بعد از دانلود
         کامل و اجرای JS) پیش‌بارگذاری می‌کند — علت اصلی «دیر ظاهرشدن لوگو
         در اسپلش» این بود که قبلاً به‌صورت Import داخل JS بود، پس تا باندل
         JS کامل دانلود/Parse نمی‌شد، اصلاً درخواستش هم شروع نمی‌شد. -->
    <link rel="preload" as="image" href="/faipco-logo.png" />

    <!-- PWA -->
    <!-- نکته: نسخه قبلی این لینک یک ?v=2 برای Cache Busting داشت — حذف شد،
         چون باعث می‌شد Chrome روی اندروید این را «نسخه/آدرس متفاوتی» از
         Manifest نصب‌شده قبلی تشخیص بدهد و دکمه «نصب» را دوباره نشان دهد،
         حتی برای کاربرانی که از قبل PWA را نصب کرده بودند. نیازی هم به آن
         نبود: location = /manifest.json در Nginx از قبل هدر
         Cache-Control: no-cache, must-revalidate می‌فرستد — یعنی مرورگر
         همیشه قبل از استفاده از نسخه Cache شده، با سرور تأیید می‌گیرد؛
         همین برای جلوگیری از قدیمی‌ماندن Manifest کافی است. -->
    <link rel="manifest" href="/manifest.json" />
    <!-- ⚠️ باید با primary.main طراحی فعال در theme.js هماهنگ باشد — اگر
         NEW_DESIGN_ENABLED آنجا تغییر کرد، این مقدار هم باید دستی به‌روز شود
         (این یک Meta Tag ثابت HTML است، نه وابسته به JS). فعلاً: #1468A7
         (طراحی جدید). مقدار قبلی (طراحی کلاسیک): #16324F -->
    <meta name="theme-color" content="#1468A7" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- اسپلش‌اسکرین بومی iOS — دقیقاً پس‌زمینه سفید (مثل SplashScreen.jsx)
         تا گذار بین این و اسپلش سفارشی React کاملاً بی‌درز باشد، نه یک
         فلاش/پرش محسوس. بدون این، iOS برای هر مدل گوشی حدس متفاوتی
         می‌زند — دقیقاً همان چیزی که باعث می‌شد روی iPhone 12 Pro Max
         تمام‌صفحه نباشد. -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1170-2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1284-2778.png"
          media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1179-2556.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1290-2796.png"
          media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1080-2340.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-750-1334.png"
          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FAIPCO" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
