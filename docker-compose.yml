# docker-compose.yml — روش اختیاری اجرا (معادل Docker-محور نصب استاندارد با install.sh)
#
# اجرا:
#   cp .env.example .env   (و مقدار POSTGRES_PASSWORD را عوض کنید)
#   cp backend/.env.example backend/.env  (و مقادیر SECRET_KEY / DB_CREDENTIALS_ENCRYPTION_KEY را تولید کنید)
#   docker compose up -d --build
#   docker compose exec backend alembic upgrade head
#   docker compose exec backend python -m scripts.seed_permissions
#   docker compose exec backend python -m scripts.create_admin --username admin --password 'ChangeMe123!'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: faipco_portal
      POSTGRES_USER: faipco_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - faipco_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faipco_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # این مقدار همیشه سرویس db داخل شبکه Docker را هدف می‌گیرد (مقدار .env نادیده گرفته می‌شود)
      DATABASE_URL: postgresql+asyncpg://faipco_user:${POSTGRES_PASSWORD:-changeme}@db:5432/faipco_portal
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  faipco_db_data:
