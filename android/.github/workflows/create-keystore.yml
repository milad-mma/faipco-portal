# فقط یک‌بار اجرا شود: کلید امضای اپ را می‌سازد.
# خروجی (Artifact یک‌روزه، فقط برای صاحب مخزن): فایل کلید، مقدار Base64 آن، رمزها و اثر انگشت SHA-256.
# بعد از کپی مقادیر در Settings ← Secrets and variables ← Actions، Artifact را حذف کنید و فایل کلید را جای امن نگه دارید.
name: Create signing key

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ساخت کلید
        run: |
          set -e
          mkdir keystore-output
          PASS="$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 32)"
          keytool -genkeypair -v -keystore keystore-output/faipco-release.jks -storetype PKCS12 \
            -alias faipco -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=FAIPCO Portal, O=FAIPCO, C=IR"
          base64 -w 0 keystore-output/faipco-release.jks > keystore-output/KEYSTORE_BASE64.txt
          FP="$(keytool -list -v -keystore keystore-output/faipco-release.jks -storepass "$PASS" -alias faipco | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          {
            echo "این مقادیر را در GitHub: Settings > Secrets and variables > Actions > New repository secret وارد کنید:"
            echo ""
            echo "KEYSTORE_BASE64  = محتوای فایل KEYSTORE_BASE64.txt (کل متن)"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_ALIAS         = faipco"
            echo "KEY_PASSWORD      = $PASS"
            echo ""
            echo "اثر انگشت SHA-256 (در پرتال: اپ اندروید > تنظیمات و نسخه‌ها وارد کنید):"
            echo "$FP"
            echo ""
            echo "فایل faipco-release.jks و این رمز را جای امن (بیرون از GitHub) نگه دارید. گم شدن آن یعنی نسخه‌ی جدید روی نسخه‌ی قبلی نصب نمی‌شود."
          } > keystore-output/README-SECRETS.txt
          echo "### اثر انگشت SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$FP\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key-DELETE-AFTER-USE
          path: keystore-output/
          retention-days: 1
