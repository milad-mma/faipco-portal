# ساخت خودکار APK امضاشده با هر push به شاخه‌ی main (یا دستی از تب Actions ← Run workflow).
# خروجی: فایل APK در بخش Artifacts همان اجرا؛ versionCode = شماره‌ی اجرا، versionName = 1.0.<شماره>.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: بررسی Secrets کلید امضا
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret های KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD تعریف نشده‌اند. اول workflow «Create signing key» را اجرا کنید (README)."
            exit 1
          fi

      - name: آماده‌سازی کلید امضا
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: ساخت APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: نام‌گذاری خروجی
        id: out
        run: |
          NAME="faipco-1.0.${GITHUB_RUN_NUMBER}-code${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "### نسخه‌ی ساخته‌شده"
            echo ""
            echo "- versionCode: **${GITHUB_RUN_NUMBER}**"
            echo "- versionName: **1.0.${GITHUB_RUN_NUMBER}**"
            echo ""
            echo "فایل APK را از بخش Artifacts پایین همین صفحه دانلود و در پرتال (اپ اندروید ← تنظیمات و نسخه‌ها) بارگذاری کنید."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: ${{ steps.out.outputs.name }}
          retention-days: 30
